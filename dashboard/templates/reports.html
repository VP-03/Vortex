<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Reports - Vortex</title>
  
  <!-- Dependencies -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Theme Styling -->
  <style>
    :root {
      --bg-primary: #0a0b0e;
      --bg-secondary: #121316;
      --accent-primary: #00ff8c;
      --accent-secondary: #0066ff;
      --text-primary: #ffffff;
      --text-secondary: #ffffff;
      --danger: #ff4757;
      --warning: #ffa502;
      --success: #2ed573;
      --glow-primary: 0 0 20px rgba(0, 255, 140, 0.2);
    }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
    }
    h2, h5, h6 {
      font-family: 'Space Grotesk', sans-serif;
    }
    .navbar {
      background: rgba(18, 19, 22, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar-brand {
      color: var(--accent-primary);
      font-weight: bold;
    }
    .nav-link {
      color: var(--text-secondary) !important;
      transition: all 0.3s ease;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text-primary) !important;
    }
    .container-fluid {
      padding: 20px;
    }
    .card {
      background: var(--bg-secondary);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      transition: 0.3s;
      color: var(--text-primary);
      box-shadow: var(--glow-primary);
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 255, 140, 0.2);
    }
    .report-card {
      cursor: pointer;
      color: var(--text-primary);
    }
    .badge-high {
      background: var(--danger);
    }
    .badge-medium {
      background: var(--warning);
      color: #000;
    }
    .badge-low {
      background: var(--success);
    }
    .back-to-reports {
      cursor: pointer;
      color: var(--accent-primary);
      margin-bottom: 15px;
      display: inline-block;
      font-weight: 600;
    }
    .back-to-reports:hover {
      text-decoration: underline;
    }
    .table {
      color: var(--text-primary);
      background: var(--bg-secondary);
    }
    .table thead th {
        color: var(--text-primary);
      background: var(--bg-secondary);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    #detail-top-sources{
        background-color: var(--bg-secondary);
        color: var(--text-primary);
    }
    .table tbody tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .chart-container {
      background: var(--bg-secondary);
      padding: 20px;
      color: var(--text-primary);
      border-radius: 16px;
      box-shadow: var(--glow-primary);
      margin-bottom: 20px;
    }
    .list-group-item {
      background: var(--bg-secondary);
      border-color: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <i class="fas fa-shield-alt me-2"></i>Vortex Dashboard
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/dash">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="/map">Attack map</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container-fluid">
  <div class="row mb-4">
    <div class="col-12">
      <h2 class="mb-4">Security Reports</h2>

      <!-- Reports List -->
      <div id="reports-list">
        <div class="row" id="reports-container">
          <!-- Reports will be loaded here -->
        </div>
      </div>

      <!-- Report Details -->
      <div id="report-detail" class="report-details" style="display:none;">
        <div class="mb-3">
          <a class="back-to-reports"><i class="fas fa-arrow-left me-2"></i>Back to Reports</a>
        </div>

        <div class="card">
          <div class="card-header bg-secondary">
            <h5 id="detail-title" class="mb-0">Report Details</h5>
          </div>
          <div class="card-body">

            <div class="mb-3"><strong>Date:</strong> <span id="detail-date"></span></div>
            <div class="mb-3"><strong>Summary:</strong> <span id="detail-summary"></span></div>

            <h5 class="mt-4 mb-3">Findings</h5>
            <div id="detail-findings"></div>

            <h5 class="mt-4 mb-3">Attack Statistics</h5>
            <div class="row">
              <div class="col-md-6">
                <div class="chart-container">
                  <canvas id="report-attack-types"></canvas>
                </div>
              </div>
              <div class="col-md-6">
                <div class="chart-container">
                  <canvas id="report-severity"></canvas>
                </div>
              </div>
            </div>

            <h5 class="mt-4 mb-3">Top Sources</h5>
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>IP Address</th>
                    <th>Country</th>
                    <th>Attack Count</th>
                    <th>Primary Attack Type</th>
                  </tr>
                </thead>
                <tbody id="detail-top-sources"></tbody>
              </table>
            </div>

            <h5 class="mt-4 mb-3">Recommendations</h5>
            <div id="detail-recommendations"></div>

          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script>
        // Charts
        let attackTypesChart;
        let severityChart;
        
        // Load Reports
        function loadReports() {
    fetch('/api/data')
        .then(response => response.json())
        .then(data => {
            const reportsContainer = document.getElementById('reports-container');
            reportsContainer.innerHTML = '';

            if (!data || data.length === 0) {
                reportsContainer.innerHTML = `
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body text-center">
                                <i class="fas fa-folder-open fa-3x mb-3 text-muted"></i>
                                <h5>No Reports Available</h5>
                                <p>There are no attack records available yet.</p>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // Group attacks by date
            // Group attacks by first_seen date
            const attacksByDate = {};
            data.forEach(attack => {
                const dateStr = attack.timestamp || attack.first_seen || attack.last_seen || '';
                let formattedDate = 'Unknown';

                if (dateStr) {
                    try {
                        const dateObj = new Date(dateStr);
                        formattedDate = dateObj.toLocaleDateString('en-GB', {
                            day: '2-digit',
                            month: 'short',
                            year: 'numeric'
                        }); // example: 28-Apr-2025
                    } catch (error) {
                        console.error('Error parsing timestamp:', dateStr, error);
                    }
                }

                if (!attacksByDate[formattedDate]) attacksByDate[formattedDate] = [];
                attacksByDate[formattedDate].push(attack);
            });
            // Sort dates in descending order
            const sortedDates = Object.keys(attacksByDate).sort((a, b) => new Date(b) - new Date(a));

            Object.entries(attacksByDate).forEach(([date, attacks]) => {
                const totalAttacks = attacks.length;

                const reportCard = document.createElement('div');
                reportCard.className = 'col-md-4 mb-4';
                reportCard.innerHTML = `
                    <div class="card report-card" data-report-date="${date}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="mb-0">Security Report</h5>
                                <span class="badge badge-low">Low Threat</span>
                            </div>
                            <p class="report-date mb-2">${date}</p>
                            <p class="report-summary">Summary of ${totalAttacks} attack events.</p>
                            <div class="mt-3">
                                <small class="text-muted" style="color: white;">
                                    <i class="fas fa-shield-alt me-1"></i> ${totalAttacks} attacks detected
                                </small>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent">
                            <button class="btn btn-sm btn-outline-primary w-100">View Details</button>
                        </div>
                    </div>
                `;
                reportsContainer.appendChild(reportCard);
            });

            document.querySelectorAll('.report-card').forEach(card => {
                card.addEventListener('click', function() {
                    const date = this.getAttribute('data-report-date');
                    loadReportDetail(date);
                });
            });
        })
        .catch(error => console.error('Error loading reports:', error));
}

        
        // Load Report Detail
        function loadReportDetail(reportDate) {
    fetch('/api/data')
        .then(response => response.json())
        .then(data => {
            const attacks = data.filter(attack => {
                const dateStr = attack.timestamp || attack.first_seen || attack.last_seen || '';
                if (!dateStr) return false;
                const attackDate = new Date(dateStr).toLocaleDateString('en-GB', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });
                return attackDate === reportDate;
            });

            if (!attacks || attacks.length === 0) {
                alert('No attacks found for selected report.');
                return;
            }

            // Hide reports list and show detail view
            document.getElementById('reports-list').style.display = 'none';
            document.getElementById('report-detail').style.display = 'block';

            document.getElementById('detail-title').textContent = `Security Report: ${reportDate}`;
            document.getElementById('detail-date').textContent = reportDate;
            document.getElementById('detail-summary').textContent = `Detailed analysis of ${attacks.length} attack events on ${reportDate}.`;

            // Findings
            const findingsContainer = document.getElementById('detail-findings');
            findingsContainer.innerHTML = '';

            const findingsList = document.createElement('ul');
            findingsList.className = 'list-group';

            attacks.forEach(attack => {
                const findingItem = document.createElement('li');
                findingItem.className = 'list-group-item';
                findingItem.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">${attack.attack_type || 'Unknown Attack'}</h6>
                            <p class="mb-0">${attack.category || 'Unknown Category'}</p>
                        </div>
                        <span class="badge bg-${attack.severity === 3 ? 'danger' : attack.severity === 2 ? 'warning' : 'success'}">
                            Severity ${attack.severity}
                        </span>
                    </div>
                `;
                findingsList.appendChild(findingItem);
            });

            findingsContainer.appendChild(findingsList);

            // Top Sources
            const topSourcesContainer = document.getElementById('detail-top-sources');
            topSourcesContainer.innerHTML = '';

            const ipHits = {};

            attacks.forEach(attack => {
                const ip = attack.ip || 'Unknown';
                if (!ipHits[ip]) {
                    ipHits[ip] = { hits: 0, country: attack.country || 'Unknown', attack_type: attack.attack_type || 'Unknown' };
                }
                ipHits[ip].hits += attack.hits || 1;
            });

            const sortedIps = Object.entries(ipHits).sort((a, b) => b[1].hits - a[1].hits).slice(0, 5);

            if (sortedIps.length === 0) {
                topSourcesContainer.innerHTML = `<tr><td colspan="4" class="text-center">No top sources available</td></tr>`;
            } else {
                sortedIps.forEach(([ip, details]) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${ip}</td>
                        <td>${details.country}</td>
                        <td>${details.hits}</td>
                        <td>${details.attack_type}</td>
                    `;
                    topSourcesContainer.appendChild(row);
                });
            }

            // Recommendations (static for now)
            const recommendationsContainer = document.getElementById('detail-recommendations');
            recommendationsContainer.innerHTML = `
                <ul class="list-group">
                    <li class="list-group-item">
                        <div class="d-flex">
                            <div class="me-3">
                                <i class="fas fa-check-circle text-success"></i>
                            </div>
                            <div>
                                <h6 class="mb-1">Review Firewall Rules</h6>
                                <p class="mb-0">Block IPs with excessive malicious traffic.</p>
                            </div>
                        </div>
                    </li>
                    <li class="list-group-item">
                        <div class="d-flex">
                            <div class="me-3">
                                <i class="fas fa-check-circle text-success"></i>
                            </div>
                            <div>
                                <h6 class="mb-1">Harden exposed services</h6>
                                <p class="mb-0">Apply latest security patches to vulnerable services.</p>
                            </div>
                        </div>
                    </li>
                </ul>
            `;

            // Charts
            const attackTypeCounts = {};
            const severityCounts = { 'high': 0, 'medium': 0, 'low': 0 };

            attacks.forEach(attack => {
                const type = attack.attack_type || 'Unknown';
                attackTypeCounts[type] = (attackTypeCounts[type] || 0) + 1;

                if (attack.severity === 3) {
                    severityCounts.high++;
                } else if (attack.severity === 2) {
                    severityCounts.medium++;
                } else {
                    severityCounts.low++;
                }
            });

            updateReportCharts({
                attack_types: attackTypeCounts,
                severity_distribution: severityCounts
            });
        })
        .catch(error => console.error('Error loading report detail:', error));
}

        
        // Update Report Charts
        function updateReportCharts(report) {
            // Attack Types Chart
            if (report.attack_types) {
                const attackTypesCtx = document.getElementById('report-attack-types').getContext('2d');
                
                // Process data
                const attackLabels = Object.keys(report.attack_types);
                const attackData = Object.values(report.attack_types);
                
                // Generate colors
                const backgroundColors = attackLabels.map((_, i) => {
                    const hue = (i * 137.5) % 360;
                    return `hsla(${hue}, 70%, 60%, 0.7)`;
                });
                
                // Destroy previous chart if exists
                if (attackTypesChart) {
                    attackTypesChart.destroy();
                }
                
                // Create new chart
                attackTypesChart = new Chart(attackTypesCtx, {
                    type: 'pie',
                    data: {
                        labels: attackLabels,
                        datasets: [{
                            data: attackData,
                            backgroundColor: backgroundColors
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'right'
                            }
                        }
                    }
                });
            }
            
            // Severity Chart
            if (report.severity_distribution) {
                const severityCtx = document.getElementById('report-severity').getContext('2d');
                
                // Process data
                const severityLabels = Object.keys(report.severity_distribution);
                const severityData = Object.values(report.severity_distribution);
                
                // Color mapping
                const severityColors = {
                    'high': 'rgba(220, 53, 69, 0.7)',
                    'medium': 'rgba(255, 193, 7, 0.7)',
                    'low': 'rgba(40, 167, 69, 0.7)'
                };
                
                const backgroundColors = severityLabels.map(label => severityColors[label.toLowerCase()] || 'rgba(108, 117, 125, 0.7)');
                
                // Destroy previous chart if exists
                if (severityChart) {
                    severityChart.destroy();
                }
                
                // Create new chart
                severityChart = new Chart(severityCtx, {
                    type: 'bar',
                    data: {
                        labels: severityLabels.map(l => l.charAt(0).toUpperCase() + l.slice(1)),
                        datasets: [{
                            label: 'Attacks',
                            data: severityData,
                            backgroundColor: backgroundColors
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    precision: 0
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            }
                        }
                    }
                });
            }
        }
        
        // Back to Reports
        document.querySelector('.back-to-reports').addEventListener('click', function() {
            document.getElementById('reports-list').style.display = 'block';
            document.getElementById('report-detail').style.display = 'none';
        });
        
        // Load initial data
        loadReports();
    </script>
</body>
</html>
